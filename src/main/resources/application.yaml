spring:
  application:
    name: core
  autoconfigure:
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${ITECHWX_DB_URL:jdbc:postgresql://localhost:5432/itechwx}
    username: ${ITECHWX_DB_USERNAME:postgres}
    password: ${ITECHWX_DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: false
itechwx:
  security:
    registration-rate-limit:
      maximum-attempts: 5
      window: PT1M
server:
  port: 8081
